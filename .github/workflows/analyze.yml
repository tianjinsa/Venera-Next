name: "代码分析"
on:
  workflow_call:
    inputs:
      concurrency_key:
        description: '调用方检查批次，隔离不同平台构建的质量任务'
        type: string
        default: ''
      platforms:
        description: 'Quality platforms: all, android, apple or desktop'
        type: string
        default: all
      skip_tests:
        description: '跳过测试，仍执行静态检查'
        required: false
        type: boolean
        default: false
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.concurrency_key || 'default' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

permissions:
  contents: read

jobs:
  changes:
    name: 版本、架构与测试范围
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      analyze: ${{ steps.scope.outputs.analyze }}
      flutter: ${{ steps.scope.outputs.flutter }}
      apple: ${{ steps.scope.outputs.apple }}
      rhttp_ios: ${{ steps.scope.outputs.rhttp_ios }}
      provider: ${{ steps.scope.outputs.provider }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-resources
      - name: 判断本次改动需要的检查
        id: scope
        env:
          QUALITY_PLATFORMS: ${{ inputs.platforms || 'all' }}
        run: python3 .github/scripts/ci_scope.py
      - run: python3 .github/scripts/release_version.py --check
      - run: python3 .github/scripts/check_structure_imports.py
      - run: python3 .github/scripts/check_architecture_dependencies.py
      - name: 验证构建与维护脚本
        if: ${{ !inputs.skip_tests && steps.scope.outputs.python == 'true' }}
        run: python3 -m unittest discover -s .github/scripts/tests -p "test_*.py"

  apple-directory-access:
    needs: changes
    name: Apple 目录授权与跨会话恢复
    if: ${{ !inputs.skip_tests && needs.changes.outputs.apple == 'true' }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
      - run: python3 .github/scripts/ci_resources.py run --label 'Swift 目录授权回归' -- swift test --package-path apple --jobs "$CI_BUILD_JOBS" --parallel --num-workers "$CI_TEST_JOBS"

  rhttp-native:
    needs: changes
    name: Rhttp 原生回调生命周期
    if: ${{ !inputs.skip_tests && needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: linux-test
          paths: packages/rhttp/rust/target
      - name: 验证锁定原生源码的取消与回调收尾
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: python3 .github/scripts/ci_resources.py run --label 'Rhttp 原生回归' -- cargo test --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - name: 编译 Flutter 测试使用的 Rhttp 库
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: python3 .github/scripts/ci_resources.py run --label 'Rhttp 测试库编译' -- cargo build --locked --manifest-path packages/rhttp/rust/Cargo.toml --lib
      - uses: actions/upload-artifact@v7
        with:
          name: linux-rhttp-test-library
          path: packages/rhttp/rust/target/debug/librhttp.so
          if-no-files-found: error
          retention-days: 1
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}

  rhttp-ios:
    needs: changes
    if: ${{ needs.changes.outputs.rhttp_ios == 'true' }}
    name: iOS Rhttp 原生依赖兼容性
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: ios-check
          paths: packages/rhttp/rust/target
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 iOS Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py --target aarch64-apple-ios
      - name: 验证锁定原生依赖可用于 iOS
        env:
          RUSTFLAGS: --cfg reqwest_unstable
        run: |
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          python3 .github/scripts/ci_resources.py run --label 'iOS Rhttp 依赖检查' -- cargo check --locked --manifest-path packages/rhttp/rust/Cargo.toml --target aarch64-apple-ios --lib
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}

  analyze:
    needs: changes
    if: ${{ needs.changes.outputs.analyze == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/ci-resources
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 准备并验证独立代码审查工具
        working-directory: tool/code_audit
        run: |
          dart pub get --enforce-lockfile
          dart analyze --fatal-infos
      - name: 运行独立代码审查工具自检
        if: ${{ !inputs.skip_tests }}
        working-directory: tool/code_audit
        run: dart run bin/self_check.dart
      - name: 验证 Git 与本地依赖来源、许可证及补丁记录
        run: dart tool/check_git_dependencies.dart
      - name: 检查本次修改的 Dart 格式
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          if [[ -n "${BASE_SHA:-}" ]]; then
            diff_range="${BASE_SHA}...HEAD"
          else
            diff_range="HEAD^...HEAD"
          fi
          mapfile -t dart_files < <(git diff --diff-filter=ACMRTUXB --name-only "$diff_range" -- '*.dart')
          if (( ${#dart_files[@]} == 0 )); then
            echo "本次没有修改 Dart 文件。"
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${dart_files[@]}"
      - run: python3 .github/scripts/ci_resources.py run --label 'Flutter 静态分析' -- flutter analyze --fatal-infos --fatal-warnings

  flutter-tests:
    name: Flutter 测试与覆盖率
    if: ${{ !inputs.skip_tests && needs.changes.outputs.flutter == 'true' }}
    needs: [changes, rhttp-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: linux-rhttp-test-library
          path: build/test-native/lib
      - name: 准备 Linux 原生测试库
        run: |
          sudo apt-get update -y
          sudo apt-get install -y cmake ninja-build g++ libsqlite3-dev
          python3 .github/scripts/ci_resources.py run --label 'Linux 原生测试库' -- python3 .github/scripts/prepare_linux_test_libraries.py
      - name: 验证原生编码与归档 ABI 的内存安全
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S packages/venera_native/src -B build/native-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DVENERA_NATIVE_BUILD_TESTS=ON \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/native-sanitizers --parallel "$CI_BUILD_JOBS"
          ctest --test-dir build/native-sanitizers --output-on-failure
      - name: 验证文档存储句柄、64 位操作与内存安全
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          cmake -S packages/venera_saf/src -B build/saf-sanitizers -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DVENERA_SAF_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build/saf-sanitizers --parallel "$CI_BUILD_JOBS"
          ctest --test-dir build/saf-sanitizers --output-on-failure
      - name: 全量 Flutter 测试与覆盖率
        run: python3 .github/scripts/ci_resources.py run --label 'Flutter 全量覆盖率' -- flutter test --no-pub --coverage --concurrency "$CI_TEST_JOBS"
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
      - name: 验证 TV 编译身份、遥控器与低内存策略
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/test-native/lib
        run: |
          python3 .github/scripts/ci_resources.py run --label 'Flutter TV 回归' -- \
            flutter test --no-pub --concurrency "$CI_TEST_JOBS" --flavor tv \
            --dart-define=EXPECT_TV=true \
            --dart-define=TV_BUILD=ci-test --dart-define=TV_REVISION=tv-test \
            test/app_runtime/tv_build_profile_test.dart \
            test/components/tv_navigation_test.dart \
            test/components/application_update_prompt_test.dart \
            test/features/favorites/favorite_folder_browser_test.dart \
            test/features/favorites/favorite_hierarchy_tv_test.dart \
            test/features/favorites/favorite_hierarchy_management_test.dart \
            test/features/reader/tv_input_test.dart \
            test/foundation/tv_reader_policy_test.dart \
            test/foundation/application_update_service_test.dart
      - name: 汇总 Dart 覆盖率
        run: python3 .github/scripts/report_dart_coverage.py coverage/lcov.info --github-summary
      - name: 上传 Dart 覆盖率报告
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  android-saf-provider:
    needs: changes
    name: Android 文档存储真实 Provider 回归
    if: ${{ !inputs.skip_tests && needs.changes.outputs.provider == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ci-resources
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备隔离 Provider 与混淆后的 Release 消费端
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "ndk;28.0.13004108" "cmake;3.22.1"
          python3 tool/saf_provider_probe/prepare_probe.py --flutter "$(command -v flutter)" --sdk "$ANDROID_HOME" --build
          python3 .github/scripts/check_saf_bundle.py --root build/dependency-followup/saf/android-probe/consumer/build/app/outputs/flutter-apk
      - name: 启用模拟器硬件加速
        run: sudo chmod a+rw /dev/kvm
      - name: 验证持久授权、Unicode、64 位文件与关闭协议
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save
          script: python3 tool/saf_provider_probe/prepare_probe.py --flutter "$(command -v flutter)" --sdk "$ANDROID_HOME" --run --serial emulator-5554
      - name: 保存 Provider 运行证据
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-saf-provider-evidence
          path: |
            build/dependency-followup/saf/android-probe/*.log
            build/dependency-followup/saf/android-probe/provider-probe.json
          if-no-files-found: error
          retention-days: 7
