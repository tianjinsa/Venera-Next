name: 构建
run-name: 构建 ${{ github.ref_name }}

on:
  workflow_call:
    outputs:
      android_signer_sha256:
        description: Public certificate fingerprint read from the configured signing keystore
        value: ${{ jobs.Build_Android.outputs.signer_sha256 }}
    inputs:
      skip_tests:
        description: '跳过测试，仍执行静态检查和构建产物校验'
        required: false
        type: boolean
        default: false
      quality_checked:
        description: '调用方已经通过同一质量检查，仅供复用工作流使用'
        required: false
        type: boolean
        default: false
      build_android:
        required: false
        type: boolean
        default: true
      build_windows:
        required: false
        type: boolean
        default: true
      build_macos:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: false
      build_linux_x64:
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
  workflow_dispatch:
    inputs:
      skip_tests:
        description: '跳过测试，仍执行静态检查和构建产物校验'
        required: false
        type: boolean
        default: false
      build_android:
        description: '构建 Android 手机和 TV 全架构安装包'
        required: true
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows'
        required: true
        type: boolean
        default: false
      build_macos:
        description: '构建 macOS'
        required: true
        type: boolean
        default: false
      build_ios:
        description: '构建 iOS'
        required: true
        type: boolean
        default: false
      build_linux_x64:
        description: '构建 Linux x64'
        required: true
        type: boolean
        default: false
      build_linux_arm64:
        description: '构建 Linux ARM64'
        required: true
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}-${{ inputs.build_android }}-${{ inputs.build_windows }}-${{ inputs.build_macos }}-${{ inputs.build_ios }}-${{ inputs.build_linux_x64 }}-${{ inputs.build_linux_arm64 }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  Manual_Quality:
    if: ${{ !inputs.quality_checked && (inputs.build_android || inputs.build_windows || inputs.build_macos || inputs.build_ios || inputs.build_linux_x64 || inputs.build_linux_arm64) }}
    uses: ./.github/workflows/analyze.yml
    with:
      concurrency_key: build-${{ inputs.build_android }}-${{ inputs.build_windows }}-${{ inputs.build_macos }}-${{ inputs.build_ios }}-${{ inputs.build_linux_x64 }}-${{ inputs.build_linux_arm64 }}
      skip_tests: ${{ inputs.skip_tests }}
      platforms: ${{ (inputs.build_macos || inputs.build_ios) && (inputs.build_android && 'all' || 'apple') || (inputs.build_android && 'android' || 'desktop') }}

  Build_Android:
    needs: Manual_Quality
    if: ${{ !cancelled() && inputs.build_android && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    outputs:
      signer_sha256: ${{ steps.signing.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
      - name: 确认 Android 构建范围
        id: plan
        run: python3 .github/scripts/build_android.py plan
      - name: 准备临时 Android 签名文件
        shell: bash
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEY_PROPERTIES: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${ANDROID_KEYSTORE:-}" || -z "${ANDROID_KEY_PROPERTIES:-}" ]]; then
            echo 'Android 签名需要配置 ANDROID_KEYSTORE 和 ANDROID_KEY_PROPERTIES Secrets。' >&2
            exit 1
          fi
          signing_dir="${RUNNER_TEMP:?}/android-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE" | base64 --decode > "$signing_dir/keystore.jks"
          printf '%s' "$ANDROID_KEY_PROPERTIES" > "$signing_dir/key.properties"
          if [[ ! -s "$signing_dir/keystore.jks" || ! -s "$signing_dir/key.properties" ]]; then
            echo 'Android 签名文件不能为空。' >&2
            exit 1
          fi
          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$signing_dir/keystore.jks" >> "$GITHUB_ENV"
          printf 'ANDROID_KEY_PROPERTIES_FILE=%s\n' "$signing_dir/key.properties" >> "$GITHUB_ENV"
      - name: 按需准备 Android 磁盘空间
        run: python3 .github/scripts/prepare_android_space.py
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: android-release-${{ steps.plan.outputs.architecture }}
          paths: build/rhttp/build
      - name: 确认配置的 Android 签名身份
        id: signing
        shell: bash
        run: |
          signer_sha256="$(java .github/scripts/AndroidSigningIdentity.java)"
          printf 'ANDROID_EXPECTED_SIGNER_SHA256=%s\n' "$signer_sha256" >> "$GITHUB_ENV"
          printf 'sha256=%s\n' "$signer_sha256" >> "$GITHUB_OUTPUT"
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/build_android.py toolchain
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - name: 顺序构建并校验 Android 安装包
        run: python3 .github/scripts/build_android.py build
      - name: 验证 Android 分享文件与回调归属
        if: ${{ !inputs.skip_tests }}
        working-directory: android
        run: ./gradlew :share_plus:testShareOwnership
      - name: 上传 Android 安装包与校验清单
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: android_build
          path: build/android-artifacts/*
          if-no-files-found: error
          retention-days: 7

      - name: 清理临时 Android 签名文件
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP:?}/android-signing"
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}

  Build_Windows:
    needs: Manual_Quality
    if: ${{ !cancelled() && inputs.build_windows && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: windows-release
          paths: build/windows/x64/plugins/rhttp/cargokit_build
      - name: 恢复 Inno Setup 编译器
        id: inno
        uses: actions/cache@v5
        with:
          path: C:\Program Files (x86)\Inno Setup 6
          key: windows-innosetup-6.7.1-v1
      - name: 安装 Inno Setup
        if: steps.inno.outputs.cache-hit != 'true'
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - name: 配置并验证 Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler)) { throw '缺少 Inno Setup 编译器。' }
          Split-Path $compiler | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 构建 Windows 安装包
        run: |
          flutter pub get --enforce-lockfile
          python windows/build.py
      - name: 验证 Windows 分享请求与 COM 归属
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          cmake -S packages/share_plus/windows/tests -B build/share-plus-tests -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/share-plus-tests --config Debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build/share-plus-tests -C Debug --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 校验 Windows 构建产物
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows.zip')
          $installer = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows-installer.exe')
          if ($zip.Count -ne 1) { throw "应当恰好生成一个 Windows zip，实际为 $($zip.Count)。" }
          if ($installer.Count -ne 1) { throw "应当恰好生成一个 Windows 安装包，实际为 $($installer.Count)。" }
          $artifacts = @($zip + $installer)
          $empty = @($artifacts | Where-Object { $_.Length -le 0 })
          if ($empty.Count -gt 0) {
            throw "Windows 构建产物包含空文件：$($empty.Name -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedRoot = [System.IO.Path]::GetFileNameWithoutExtension($zip[0].Name)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $badEntries = @($archive.Entries | Where-Object {
              -not $_.FullName.StartsWith("$expectedRoot/") -and $_.FullName -ne "$expectedRoot/"
            })
            if ($badEntries.Count -gt 0) {
              throw "Windows zip 包含 $expectedRoot/ 之外的文件：$($badEntries.FullName -join ', ')"
            }
            $exeEntry = @($archive.Entries | Where-Object { $_.FullName -eq "$expectedRoot/VeneraNext.exe" })
            if ($exeEntry.Count -ne 1) {
              throw "Windows zip 未包含 $expectedRoot/VeneraNext.exe"
            }
          } finally {
            $archive.Dispose()
          }
          $artifacts | Sort-Object Name | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - name: 编译并运行 Windows 原生启动测试
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cmake -S windows/tests -B build/windows/startup_tests -A x64
          cmake --build build/windows/startup_tests --config Release
          ctest --test-dir build/windows/startup_tests -C Release --output-on-failure
      - name: 验证 Windows 安装、无头命令与实际启动
        if: ${{ !inputs.skip_tests }}
        shell: pwsh
        timeout-minutes: 12
        run: |
          $installers = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraNext-*-windows-installer.exe')
          if ($installers.Count -ne 1) { throw '静默安装测试需要恰好一个安装包。' }
          ./.github/scripts/test_windows_startup.ps1 -Installer $installers[0].FullName
      - name: 上传 Windows 启动诊断
        if: ${{ always() && !inputs.skip_tests }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-startup-logs
          path: build/windows/startup-smoke/**/*.log
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: windows_build
          path: |
            build/windows/VeneraNext-*-windows.zip
            build/windows/VeneraNext-*-windows-installer.exe
          if-no-files-found: error
          retention-days: 7
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}

  Build_Apple:
    needs: Manual_Quality
    if: ${{ !cancelled() && (inputs.build_macos || inputs.build_ios) && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUILD_MACOS: ${{ inputs.build_macos }}
      BUILD_IOS: ${{ inputs.build_ios }}
      COCOAPODS_DISABLE_STATS: 'true'
      COCOAPODS_SKIP_UPDATE_MESSAGE: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: apple-release-xcode16.4-${{ inputs.build_macos }}-${{ inputs.build_ios }}
          paths: |
            build/macos/**/rhttp.build
            build/ios/**/rhttp.build
      - name: 恢复 CocoaPods 下载缓存
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods/repos
          key: apple-pods-${{ runner.arch }}-${{ hashFiles('pubspec.lock', 'ios/Podfile*', 'macos/Podfile*', 'packages/**/*.podspec') }}
          restore-keys: |
            apple-pods-${{ runner.arch }}-
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
          cache: true
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备所选 Apple 平台的 Rust 工具链
        run: python3 .github/scripts/prepare_apple_build.py
      - name: 串行化 Rustup 安装操作
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-rustup.lock" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Flutter macOS 应用
        run: flutter build macos --release --no-pub
        if: ${{ inputs.build_macos }}
      - name: 创建 DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          if ! cp -cR build/macos/Build/Products/Release/VeneraNext.app dist/dmg_contents/; then
            rm -rf dist/dmg_contents/VeneraNext.app
            cp -R build/macos/Build/Products/Release/VeneraNext.app dist/dmg_contents/
          fi
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "VeneraNext" -srcfolder dist/dmg_contents -ov -format UDZO -imagekey zlib-level=1 "dist/VeneraNext.dmg"
        if: ${{ inputs.build_macos }}
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv dist/VeneraNext.dmg "result/VeneraNext-$APP_VERSION.dmg"
        if: ${{ inputs.build_macos }}
      - name: 上传 DMG
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: macos_build
          path: result/*.dmg
          if-no-files-found: error
          retention-days: 7
        if: ${{ inputs.build_macos }}
      - name: 构建 iOS 应用
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          if [ "$IOS_BUILD" = "$APP_VERSION" ]; then
            IOS_BUILD=1
          fi
          IOS_VERSION="${IOS_VERSION%%-*}"
          echo "正在根据 ${APP_VERSION} 构建 iOS 包版本 ${IOS_VERSION}+${IOS_BUILD}"
          flutter build ios --release --no-codesign --no-pub \
            --build-name "$IOS_VERSION" --build-number "$IOS_BUILD"
        if: ${{ inputs.build_ios }}
      - name: 校验 iOS 原生版本与应用更新渠道
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          IOS_VERSION="${IOS_VERSION%%-*}"
          APP_BUNDLE="build/ios/iphoneos/Runner.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_BUNDLE/Info.plist")" = "$IOS_VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_BUNDLE/Info.plist")" = "$IOS_BUILD"
          BUNDLED_VERSION=$(sed -n 's/^version:[[:space:]]*//p' "$APP_BUNDLE/Frameworks/App.framework/flutter_assets/pubspec.yaml" | tr -d '\r\n')
          test "$BUNDLED_VERSION" = "$APP_VERSION"
        if: ${{ inputs.build_ios }}
      - name: 创建 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r -1 VeneraNext-ios.ipa Payload
        if: ${{ inputs.build_ios }}
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv build/ios/iphoneos/VeneraNext-ios.ipa "result/VeneraNext-ios-$APP_VERSION.ipa"
        if: ${{ inputs.build_ios }}
      - uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: ios_build
          path: result/*.ipa
          if-no-files-found: error
          retention-days: 7
        if: ${{ inputs.build_ios }}
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}

  Build_Linux:
    needs: Manual_Quality
    if: ${{ !cancelled() && (inputs.build_linux_x64 || inputs.build_linux_arm64) && (needs.Manual_Quality.result == 'success' || needs.Manual_Quality.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.build_linux_x64 && inputs.build_linux_arm64 && '["x64","arm64"]' || inputs.build_linux_x64 && '["x64"]' || '["arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 500M
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-cache
        id: rust_cache
        with:
          group: linux-release-${{ matrix.arch }}
          paths: build/linux/${{ matrix.arch }}/release/plugins/rhttp/cargokit_build
      - name: 配置原生编译缓存
        run: |
          echo "CCACHE_DIR=$RUNNER_TEMP/native-ccache" >> "$GITHUB_ENV"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/native-ccache
          key: ccache-linux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/linux-build-packages.txt', 'pubspec.lock', 'linux/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux-${{ matrix.arch }}-${{ hashFiles('.github/scripts/linux-build-packages.txt', 'pubspec.lock', 'linux/CMakeLists.txt') }}-
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'arm64'
        with:
          # Bootstrap the pinned Flutter revision on ARM64, where official SDK archives are absent.
          channel: master
          flutter-version-file: pubspec.yaml
          cache: true
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - run: flutter pub get --enforce-lockfile
      - name: 安装缺失的 Linux 构建依赖
        run: python3 .github/scripts/prepare_linux_build.py
      - name: 恢复 AppImage 打包工具
        uses: actions/cache@v5
        with:
          path: build/linux/${{ matrix.arch }}/packages/tools
          key: appimage-tools-${{ matrix.arch }}-${{ hashFiles('.github/scripts/build_linux_packages.py') }}
      - uses: docker/setup-buildx-action@v3
        if: ${{ matrix.arch == 'x64' || !inputs.skip_tests }}
      - name: 准备可复用的 Arch 打包容器
        if: matrix.arch == 'x64'
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts
          file: .github/scripts/arch-builder.Dockerfile
          load: true
          tags: venera-arch-builder:ci
          cache-from: type=gha,scope=arch-package-x64
          cache-to: type=gha,scope=arch-package-x64,mode=max
      - name: 准备可复用的 AppImage 验证容器
        if: ${{ !inputs.skip_tests }}
        uses: docker/build-push-action@v6
        with:
          context: .github/scripts
          file: .github/scripts/appimage-smoke.Dockerfile
          load: true
          tags: venera-appimage-smoke:ci
          cache-from: type=gha,scope=appimage-smoke-${{ matrix.arch }}
          cache-to: type=gha,scope=appimage-smoke-${{ matrix.arch }},mode=max
      - name: 修补 ARM64 字体
        if: matrix.arch == 'arm64'
        run: dart run patch/font.dart
      - name: 编译一次并生成 DEB
        env:
          LINUX_ARCH: ${{ matrix.arch }}
        run: python3 debian/build.py "$LINUX_ARCH"
      - name: 从同一应用目录构建 RPM 和 AppImage
        env:
          LINUX_ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/build_linux_packages.py --arch "$LINUX_ARCH"
      - name: 在无 GTK 和 WebKit 的容器中验证 AppImage
        if: ${{ !inputs.skip_tests }}
        env:
          LINUX_ARCH: ${{ matrix.arch }}
          APPIMAGE_SMOKE_IMAGE: venera-appimage-smoke:ci
        run: bash .github/scripts/test_appimage.sh "$LINUX_ARCH"
      - name: 构建 Arch 软件包
        if: matrix.arch == 'x64'
        run: python3 .github/scripts/build_arch_package.py --docker-image venera-arch-builder:ci
      - name: 上传 Linux 额外安装包
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: linux_extra_${{ matrix.arch }}
          path: |
            build/linux/${{ matrix.arch }}/packages/*.rpm
            build/linux/${{ matrix.arch }}/packages/*.AppImage
          if-no-files-found: error
          retention-days: 7
      - name: 上传 DEB
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: ${{ matrix.arch == 'x64' && 'deb_build' || 'deb_arm64_build' }}
          path: build/linux/${{ matrix.arch }}/release/debian
          if-no-files-found: error
          retention-days: 7
      - name: 上传 Arch 软件包
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: arch_build
          path: build/linux/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
      - name: 汇总原生编译缓存命中情况
        if: always()
        run: |
          if command -v ccache >/dev/null; then ccache --show-stats; fi
      - name: 保存可恢复的 Rust 编译缓存
        if: ${{ always() && steps.rust_cache.outputs.cache-hit != 'true' && steps.rust_cache.outputs.key != '' }}
        continue-on-error: true
        uses: ./.github/actions/rust-cache-save
        with:
          key: ${{ steps.rust_cache.outputs.key }}
          paths: ${{ steps.rust_cache.outputs.paths }}
          status: ${{ job.status }}
