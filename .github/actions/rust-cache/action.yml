name: Cache Rust dependencies and compilation
description: Cache source downloads and the actual Cargo target directories, separated by target and toolchain inputs.
inputs:
  group:
    description: Platform, profile and target set
    required: true
  paths:
    description: Actual Cargo target directories used by this job
    required: true
outputs:
  key:
    description: Primary key for a complete successful build
    value: ${{ steps.restore.outputs.cache-primary-key }}
  cache-hit:
    description: Whether a complete cache matched the primary key
    value: ${{ steps.restore.outputs.cache-hit }}
  paths:
    description: Cargo target directories to save at the end of the job
    value: ${{ inputs.paths }}
runs:
  using: composite
  steps:
    - id: restore
      uses: actions/cache/restore@v5
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          ${{ inputs.paths }}
        key: rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('rust-toolchain.toml', 'packages/rhttp/rust/Cargo.lock', 'packages/rhttp/rust/Cargo.toml', 'packages/rhttp/rust/cargokit.yaml', 'packages/rhttp/cargokit/**', 'pubspec.yaml', 'pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'packages/rhttp/android/**', 'packages/rhttp/**/*.podspec', 'packages/rhttp/**/CMakeLists.txt') }}-${{ hashFiles('packages/rhttp/rust/src/**', 'packages/rhttp/rust/build.rs') }}
        restore-keys: |
          rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('rust-toolchain.toml', 'packages/rhttp/rust/Cargo.lock', 'packages/rhttp/rust/Cargo.toml', 'packages/rhttp/rust/cargokit.yaml', 'packages/rhttp/cargokit/**', 'pubspec.yaml', 'pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'packages/rhttp/android/**', 'packages/rhttp/**/*.podspec', 'packages/rhttp/**/CMakeLists.txt') }}-${{ hashFiles('packages/rhttp/rust/src/**', 'packages/rhttp/rust/build.rs') }}-partial-
          rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.group }}-${{ hashFiles('rust-toolchain.toml', 'packages/rhttp/rust/Cargo.lock', 'packages/rhttp/rust/Cargo.toml', 'packages/rhttp/rust/cargokit.yaml', 'packages/rhttp/cargokit/**', 'pubspec.yaml', 'pubspec.lock', 'android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties', 'packages/rhttp/android/**', 'packages/rhttp/**/*.podspec', 'packages/rhttp/**/CMakeLists.txt') }}-
