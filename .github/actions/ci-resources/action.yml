name: Runner resource budget
description: Detect CPU and memory limits and share bounded test/build concurrency
runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ github.action_path }}
      env:
        CI_RESOURCE_SCRIPT: ${{ github.action_path }}/../../scripts/ci_resources.py
      run: python "$CI_RESOURCE_SCRIPT" configure
