plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 3]

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystorePropertiesPath = System.getenv("ANDROID_KEY_PROPERTIES_FILE")
def keystorePropertiesFile = keystorePropertiesPath ? file(keystorePropertiesPath) : rootProject.file("key.properties")
def keystoreProperties = new Properties()
keystorePropertiesFile.withInputStream { stream ->
    keystoreProperties.load(stream)
}
// CI keeps signing files outside the checkout and overrides the local storeFile.
def keystoreFilePath = System.getenv("ANDROID_KEYSTORE_FILE") ?: keystoreProperties['storeFile']
def buildAbis = (System.getenv("ANDROID_BUILD_ABIS") ?: "armeabi-v7a,arm64-v8a,x86_64").split(",").toList()
if (buildAbis.isEmpty() || buildAbis.any { !project.ext.abiCodes.containsKey(it) }) {
    throw new GradleException("Unsupported ANDROID_BUILD_ABIS selection")
}

android {
    namespace = "com.github.cyrilpeng.veneranext"
    compileSdk = flutter.compileSdkVersion
    ndkVersion "28.0.13004108"

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }

    splits{
        abi {
            reset()
            include(*buildAbis)
            enable true
            universalApk(buildAbis.size() > 1)
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions{
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        debug {
            storeFile file(keystoreFilePath)
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreFilePath)
            storePassword keystoreProperties['storePassword']
        }
    }

    defaultConfig {
        applicationId = "com.github.cyrilpeng.veneranext"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    flavorDimensions += "device"
    productFlavors {
        mobile {
            dimension "device"
        }
        tv {
            dimension "device"
            applicationIdSuffix ".tv"
            // Keep upgrades above the retired Alpha sequence (100000 + run).
            versionCode = flutterVersionCode.toInteger() + 200000
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            ndk {
                abiFilters(*buildAbis)
            }
            signingConfig signingConfigs.release
        }
        debug {
            ndk {
                abiFilters(*buildAbis)
            }
            signingConfig signingConfigs.debug
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def platform = variant.flavorName == "tv" ? "android-tv" : "android"
            if (variant.buildType.name == "release") {
                if (abi != null) {
                    outputFileName = "VeneraNext-${variant.versionName}-${platform}-${abi}.apk"
                    def abiVersionCode = project.ext.abiCodes.get(abi)
                    if (abiVersionCode != null) {
                        versionCodeOverride = variant.versionCode * 10 + abiVersionCode
                    }
                } else {
                    outputFileName = "VeneraNext-${variant.versionName}-${platform}.apk"
                    versionCodeOverride = variant.versionCode * 10
                }
            } else if (variant.buildType.name == "debug") {
                versionCodeOverride = variant.versionCode * 10 + 4
            }
        }
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.activity:activity-ktx:1.10.1"
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
