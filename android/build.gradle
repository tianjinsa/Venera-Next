allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects { subproject ->
    subproject.buildDir = "${rootProject.buildDir}/${subproject.name}"

    // These native clipboard plugins still declare compileSdk 31.
    // Their AndroidX dependencies require at least API 34.
    if (subproject.name in ["super_native_extensions", "irondash_engine_context"]) {
        subproject.pluginManager.withPlugin("com.android.library") {
            subproject.androidComponents.finalizeDsl { library ->
                def appCompileSdk = rootProject.project(":app").android.compileSdk
                library.compileSdk = Math.max(library.compileSdk, appCompileSdk)
            }
        }
    }
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Cargokit otherwise adds emulator ABIs even to an explicit ARM64 Debug build.
// Apply the CI selection after plugins have registered their Cargo tasks.
gradle.projectsEvaluated {
    def selectedAbis = System.getenv("ANDROID_BUILD_ABIS")
    if (selectedAbis) {
        def platformsByAbi = ["armeabi-v7a": "android-arm", "arm64-v8a": "android-arm64", "x86_64": "android-x64"]
        def selectedPlatforms = selectedAbis.split(",").collect { platformsByAbi[it] }
        if (selectedPlatforms.any { it == null }) {
            throw new GradleException("Unsupported ANDROID_BUILD_ABIS selection")
        }
        subprojects { subproject ->
            subproject.tasks.matching { it.name.startsWith("cargokitCargoBuild") }.configureEach { cargoTask ->
                cargoTask.targetPlatforms = selectedPlatforms
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
